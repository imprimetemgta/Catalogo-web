# Copia este archivo como config_ventas.ini (junto al script) y ajusta los valores.
# El config_ventas.ini con la clave real NUNCA se sube a GitHub.

[CONEXION]
# Carpeta Data de la empresa en A2 (la ruta de la tienda).
carpeta_datos = C:\A2\A2imprimete\Empre001\Data
# Opcional: si prefieres un DSN ya creado en Windows, ponlo aqui.
# Sin DSN se usa directamente el driver "DBISAM 4 ODBC Driver".
# dsn = A2SOFTWAY_DB
# Opcionales, solo si la base pide usuario y clave.
# user =
# password =

[WEB]
# En la prueba local: http://localhost:3000/api/sync-ventas
# En produccion: https://<dominio>/api/sync-ventas
api_url = http://localhost:3000/api/sync-ventas
# El mismo valor de SYNC_SECRET que esta en Vercel.
sync_secret = <PEGAR_SYNC_SECRET>

[SALIDA]
# Donde se guarda una copia del JSON enviado (relativa al script).
carpeta_salida = exportaciones

[LOG]
carpeta_logs = logs
nivel = INFO
archivar = si
